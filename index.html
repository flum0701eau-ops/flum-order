<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FLÜM ORDER</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:#000;
}

/* 🌫️煙動画 */
.bg-video{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:1;
opacity:0.18;
filter:blur(1.5px) brightness(1.2);
pointer-events:none;
}

/* うっすら光 */
.overlay{
position:absolute;
inset:0;
background:radial-gradient(circle at center, rgba(255,255,255,0.08), rgba(0,0,0,0.5));
z-index:2;
}

/* UIカード */
.container{
position:relative;
z-index:3;
width:90%;
max-width:420px;
text-align:center;
padding:50px 26px;
border-radius:30px;

background:rgba(255,255,255,0.08);
backdrop-filter:blur(22px);

border:1px solid rgba(255,255,255,0.12);

box-shadow:0 30px 80px rgba(0,0,0,0.35);
}

/* タイトル */
h1{
font-size:42px;
letter-spacing:10px;
font-weight:300;
color:#fff;
}

.sub{
font-size:12px;
letter-spacing:4px;
color:rgba(255,255,255,0.6);
margin-top:8px;
}

/* 説明 */
.text{
margin-top:40px;
font-size:12px;
color:rgba(255,255,255,0.6);
letter-spacing:2px;
}

/* ORDER */
.orderBtn{
margin:20px auto 25px;
display:block;
width:88%;
padding:18px;
border-radius:16px;

background:rgba(255,255,255,0.9);
color:#111;

font-size:16px;
letter-spacing:3px;
text-decoration:none;

box-shadow:0 15px 35px rgba(0,0,0,0.4);
transition:0.2s;
}

.orderBtn:active{
transform:scale(0.97);
}

/* 下ボタン */
.row{
display:flex;
gap:12px;
}

.smallBtn{
flex:1;
padding:14px 0;
border-radius:14px;
background:rgba(255,255,255,0.1);
border:1px solid rgba(255,255,255,0.15);
text-decoration:none;
font-size:11px;
letter-spacing:2px;
color:#fff;
}

.footer{
margin-top:28px;
font-size:10px;
letter-spacing:2px;
color:rgba(255,255,255,0.4);
}

</style>
</head>

<body>

<!-- 🌫️煙動画 -->
<video class="bg-video" autoplay muted loop playsinline>
  <source src="smoke.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="container">

<h1>FLÜM</h1>
<div class="sub">SHISHA CAFE & BAR</div>

<div class="text">ご注文はこちらから</div>

<a class="orderBtn" id="orderBtn">ORDER</a>

<div class="row">
<a class="smallBtn" href="https://www.instagram.com/flum0701">INSTAGRAM</a>

<a class="smallBtn" href="https://search.google.com/local/writereview?placeid=ChIJMYIVIGnnAGARTbq80Jket98">
REVIEW
</a>
</div>

<div class="footer">
OSAKA MINAMI
</div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const table = params.get("t");

const urls = {
"1":"https://spo.order.airregi.jp/auth/seat?t=17d80d46-9a40-400a-ae90-4738dee7e95f&qrSize=3",
"2":"https://spo.order.airregi.jp/auth/seat?t=fa86f12b-3295-46aa-b35e-8ed5fe036d1a&qrSize=3",
"3":"https://spo.order.airregi.jp/auth/seat?t=a44bbacc-d0fa-48ec-b15b-39674dcc5623&qrSize=3",
"4":"https://spo.order.airregi.jp/auth/seat?t=8fb9556b-04a4-4a8e-bf0a-be712764854e&qrSize=3",
"5":"https://spo.order.airregi.jp/auth/seat?t=2bfd7391-9e21-44f7-939c-dcd19fbdca02&qrSize=3"
};

document.getElementById("orderBtn").onclick = () => {
if(urls[table]){
window.location.href = urls[table];
}
};
</script>

</body>
</html>
