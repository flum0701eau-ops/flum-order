<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script>

const liffId = "2007912475-TlwIvzlF";

/* 席保存 */
const table = new URLSearchParams(location.search).get("t");

liff.init({ liffId })
.then(() => {

  if (table) {
    localStorage.setItem("table", table);
  }

  console.log("INIT OK");

  console.log("isInClient:", liff.isInClient());

  if (liff.isInClient()) {
    console.log("CLOSE");
    liff.closeWindow();
  }

})
.catch(err => {
  alert("LIFF ERROR: " + JSON.stringify(err));
});

</script>
