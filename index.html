<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FLÜM ORDER</title>

<style>

/* ===== ベース ===== */
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#111;
font-family:sans-serif;
}

/* ===== コンテナ ===== */
.wrap{
position:relative;
width:100%;
max-width:420px;
z-index:2;
}

/* ===== 背景画像 ===== */
.bg{
width:100%;
display:block;
border-radius:18px;
}

/* ===== ボタン共通 ===== */
.btn{
position:absolute;
left:50%;
transform:translateX(-50%);
padding:16px 22px;
border-radius:14px;
text-decoration:none;
letter-spacing:2px;
font-size:13px;
transition:0.2s ease;
backdrop-filter: blur(10px);
}

/* ===== ORDER ===== */
.order{
top:42%;
background:rgba(0,0,0,0.85);
color:#fff;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

/* ===== INSTAGRAM ===== */
.ig{
top:62%;
background:rgba(255,255,255,0.9);
color:#111;
}

/* ===== REVIEWS ===== */
.rev{
top:75%;
background:rgba(255,255,255,0.9);
color:#111;
}

/* ===== 押した時ふわっと ===== */
.btn:active{
transform:translateX(-50%) scale(0.96);
opacity:0.8;
}

</style>
</head>

<body>

<div class="wrap">

  <!-- 画像 -->
  <img class="bg" src="flum.jpg" />

  <!-- ボタン -->
  <a class="btn order" id="orderBtn">ORDER →</a>

  <a class="btn ig" href="https://www.instagram.com/flum0701">INSTAGRAM</a>

  <a class="btn rev" href="https://search.google.com/local/writereview?placeid=ChIJMYIVIGnnAGARTbq80Jket98">REVIEWS</a>

</div>

<script>

/* テーブル判別 */
const params = new URLSearchParams(window.location.search);
const table = params.get("t");

const urls = {
"1":"https://spo.order.airregi.jp/auth/seat?t=17d80d46-9a40-400a-ae90-4738dee7e95f&qrSize=3",
"2":"https://spo.order.airregi.jp/auth/seat?t=fa86f12b-3295-46aa-b35e-8ed5fe036d1a&qrSize=3",
"3":"https://spo.order.airregi.jp/auth/seat?t=a44bbacc-d0fa-48ec-b15b-39674dcc5623&qrSize=3",
"4":"https://spo.order.airregi.jp/auth/seat?t=8fb9556b-04a4-4a8e-bf0a-be712764854e&qrSize=3",
"5":"https://spo.order.airregi.jp/auth/seat?t=2bfd7391-9e21-44f7-939c-dcd19fbdca02&qrSize=3"
};

document.getElementById("orderBtn").onclick = () => {
  if(urls[table]){
    window.location.href = urls[table];
  } else {
    alert("テーブル情報がありません");
  }
};

</script>

</body>
</html>
