<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLÜM</title>

<style>

body{
margin:0;
background:#000;
display:flex;
justify-content:center;
font-family:sans-serif;
}

.wrap{
position:relative;
width:100%;
max-width:420px;
}

.bg{
width:100%;
display:block;
}

/* UI */
.ui{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-45%);
width:85%;
text-align:center;
}

/* ロゴ（1個だけ） */
.logo{
width:140px;
margin:0 auto 12px auto;
display:block;
}

/* テキスト */
.sub{
font-size:13px;
color:#333;
margin-bottom:14px;
}

/* ORDER */
.order{
display:block;
width:100%;
padding:18px 0;
border-radius:16px;
background:#111;
color:#C8A96A;
text-decoration:none;
margin-bottom:20px;
}

/* 下 */
.bottom{
display:flex;
gap:12px;
}

.btn{
flex:1;
padding:14px 0;
border-radius:12px;
background:rgba(245,236,220,0.85);
border:1px solid #C8A96A;
text-decoration:none;
color:#111;
}

</style>
</head>

<body>

<div class="wrap">

<img class="bg" src="flum.jpg">

<div class="ui">

<img class="logo" src="logo.png">

<div class="sub">ご注文はこちらから</div>

<a class="order" id="orderBtn">ORDER</a>

<div class="bottom">
<a class="btn">INSTAGRAM</a>
<a class="btn">REVIEWS</a>
</div>

</div>

</div>

</body>
</html>
