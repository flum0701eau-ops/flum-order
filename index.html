<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FLÜM ORDER</title>

<style>

body{
margin:0;
background:#000;
display:flex;
justify-content:center;
font-family: "Helvetica", sans-serif;
}

.wrap{
position:relative;
width:100%;
max-width:420px;
}

.bg{
width:100%;
display:block;
}

/* UI全体 */
.ui{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-42%);
width:86%;
text-align:center;
}

/* 小さいテキスト */
.sub{
font-size:13px;
color:#333;
margin-bottom:10px;
}

/* ===== ORDER（黒×金） ===== */
.order{
display:block;
width:100%;
padding:18px 0;
border-radius:16px;

background:#111;
color:#C8A96A; /* 金 */
text-decoration:none;
letter-spacing:3px;
font-weight:500;

box-shadow:0 10px 30px rgba(0,0,0,0.25);
margin-bottom:22px;
}

/* ===== 下ボタン共通 ===== */
.bottom{
display:flex;
gap:12px;
}

.btn{
flex:1;
padding:14px 0;
border-radius:12px;

background:rgba(245,236,220,0.85); /* ベージュ */
border:1px solid #C8A96A;

color:#111;
text-decoration:none;
font-size:12px;
letter-spacing:1px;

backdrop-filter: blur(8px);
-webkit-backdrop-filter: blur(8px);
}

/* hover感（スマホでも少し効く） */
.order:active{
transform:scale(0.99);
}

.btn:active{
transform:scale(0.98);
}

</style>
</head>

<body>

<div class="wrap">

<img class="bg" src="flum.jpg">

<div class="ui">

<div class="sub">ご注文はこちらから</div>

<a class="order" href="#">
ORDER →
</a>

<div class="bottom">
  <a class="btn" href="#">INSTAGRAM</a>
  <a class="btn" href="#">REVIEWS</a>
</div>

</div>

</div>

</body>
</html>
