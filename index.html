<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLÜM ORDER</title>

<style>

body{
margin:0;
background:#000;
font-family:sans-serif;
}

.wrap{
position:relative;
width:100%;
max-width:420px;
margin:0 auto;
}

/* 背景 */
.bg{
width:100%;
height:100vh;
object-fit:cover;
display:block;
}

/* UI */
.ui{
position:absolute;
top:65%;
left:50%;
transform:translate(-50%,-50%);
width:86%;
text-align:center;
}

/* テキスト */
.sub{
font-size:13px;
color:#333;
margin-bottom:16px;
}

/* ORDER */
.order{
display:block;
width:100%;
padding:18px 0;
border-radius:16px;
background:#111;
color:#C8A96A;
text-decoration:none;
letter-spacing:3px;
font-weight:500;
box-shadow:0 12px 30px rgba(0,0,0,0.3);
margin-bottom:16px;
}

/* LINEボタン */
.line{
display:block;
width:100%;
padding:14px 0;
border-radius:14px;
background:#00C300;
color:#fff;
text-decoration:none;
font-weight:600;
margin-bottom:14px;
}

/* 説明文（プロ版：見やすく改善） */
.coupon-text{
font-size:12px;
color:#222;
line-height:1.7;
margin:10px 0 18px;
text-align:center;
font-weight:500;
opacity:0.9;
}

/* 下ボタン */
.bottom{
display:flex;
gap:12px;
}

.btn{
flex:1;
padding:14px 0;
border-radius:12px;
background:rgba(245,236,220,0.9);
border:1px solid #C8A96A;
color:#111;
text-decoration:none;
font-size:12px;
letter-spacing:1px;
backdrop-filter: blur(10px);
-webkit-backdrop-filter: blur(10px);
}

.order:active{transform:scale(0.98);}
.btn:active{transform:scale(0.97);}

</style>
</head>

<body>

<div class="wrap">

<img class="bg" src="flum.jpg">

<div class="ui">

<div class="sub">ご注文はこちらから</div>

<a class="order" id="orderBtn">ORDER</a>

<a class="line" href="https://lin.ee/s4wHdT9" target="_blank">
LINE 友だち追加
</a>

<p class="coupon-text">
LINEにて限定割引クーポン配信中🌸<br>
是非ご登録下さい😊<br><br>
予約・デリバリーシーシャなど随時LINE、Instagramにて受付中🌼
</p>

<div class="bottom">
  <a class="btn" href="https://www.instagram.com/flum0701/">INSTAGRAM</a>

  <a class="btn" href="https://search.google.com/local/writereview?placeid=ChIJMYIVIGnnAGARTbq80Jket98" target="_blank">
    REVIEWS
  </a>
</div>

</div>
</div>

<script>

/* =========================
   卓判別（強化版）
========================= */
const params = new URLSearchParams(window.location.search);
let table = params.get("t");

/* 無効チェック */
if (!table || !["1","2","3","4","5"].includes(table)) {
  console.warn("table error:", table);

  alert(
    "テーブルが認識できません\n\n" +
    "原因：QRのURLに ?t=1〜5 が入っていません"
  );
}

/* =========================
   AirレジURL
========================= */
const urls = {
  "1": "https://spo.order.airregi.jp/auth/seat?t=17d80d46-9a40-400a-ae90-4738dee7e95f&qrSize=3",
  "2": "https://spo.order.airregi.jp/auth/seat?t=fa86f12b-3295-46aa-b35e-8ed5fe036d1a&qrSize=3",
  "3": "https://spo.order.airregi.jp/auth/seat?t=a44bbacc-d0fa-48ec-b15b-39674dcc5623&qrSize=3",
  "4": "https://spo.order.airregi.jp/auth/seat?t=8fb9556b-04a4-4a8e-bf0a-be712764854e&qrSize=3",
  "5": "https://spo.order.airregi.jp/auth/seat?t=2bfd7391-9e21-44f7-939c-dcd19fbdca02&qrSize=3"
};

/* =========================
   ORDER処理
========================= */
document.getElementById("orderBtn").addEventListener("click", function(e){
  e.preventDefault();

  if (table && urls[table]) {
    window.location.href = urls[table];
  } else {
    alert(
      "テーブル未設定\n\n" +
      "もう一度QRを読み込んでください"
    );
  }

});

</script>

</body>
</html>
