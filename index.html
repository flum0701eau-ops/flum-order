<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FLÜM ORDER</title>

<style>

/* =====================
  ベース
===================== */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Helvetica Neue", sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#f3f0ea;
overflow:hidden;
}

/* =====================
  煙（動画）
===================== */
.smoke{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
opacity:0.18;
z-index:0;
pointer-events:none;
}

/* =====================
  花背景（軽い装飾）
===================== */
.flower{
position:absolute;
font-size:120px;
opacity:0.08;
z-index:0;
}

.flower.left{top:20px;left:10px;}
.flower.right{bottom:20px;right:10px;}

/* =====================
  カード
===================== */
.card{
width:88%;
max-width:380px;
padding:28px;
border-radius:28px;

background:rgba(255,255,255,0.55);
backdrop-filter: blur(20px);

box-shadow:0 20px 50px rgba(0,0,0,0.12);
text-align:center;
position:relative;
z-index:2;
}

/* =====================
  ロゴ
===================== */
.logo{
font-size:34px;
letter-spacing:6px;
}

.sub{
font-size:12px;
letter-spacing:3px;
color:#666;
margin-top:6px;
}

/* =====================
  ORDER
===================== */
.order{
margin-top:28px;
display:block;
padding:18px;
border-radius:16px;
background:#111;
color:#fff;
text-decoration:none;
font-size:16px;
letter-spacing:2px;
box-shadow:0 10px 25px rgba(0,0,0,0.25);

transition:0.15s ease;
}

.order:active{
transform:scale(0.97) translateY(1px);
opacity:0.9;
}

/* =====================
  サブボタン
===================== */
.row{
display:flex;
gap:12px;
margin-top:14px;
}

.btn{
flex:1;
padding:14px;
border-radius:14px;
text-decoration:none;
font-size:13px;
letter-spacing:1px;

background:rgba(255,255,255,0.7);
color:#111;
border:1px solid rgba(0,0,0,0.08);

transition:0.15s ease;
}

.btn:active{
transform:scale(0.96);
opacity:0.85;
}

/* =====================
  フッター
===================== */
footer{
margin-top:18px;
font-size:11px;
color:#777;
letter-spacing:2px;
}

</style>
</head>

<body>

<!-- 煙 -->
<video autoplay muted loop playsinline class="smoke">
  <source src="smoke.mp4" type="video/mp4">
</video>

<!-- 装飾 -->
<div class="flower left">✿</div>
<div class="flower right">✿</div>

<!-- UI -->
<div class="card">

<div class="logo">FLÜM</div>
<div class="sub">SHISHA CAFE & BAR</div>

<a class="order" id="orderBtn">ORDER</a>

<div class="row">
<a class="btn" href="https://www.instagram.com/flum0701">INSTAGRAM</a>
<a class="btn" href="https://search.google.com/local/writereview?placeid=ChIJMYIVIGnnAGARTbq80Jket98">REVIEW</a>
</div>

<footer>OSAKA MINAMI</footer>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const table = params.get("t");

const urls = {
"1":"https://spo.order.airregi.jp/auth/seat?t=17d80d46-9a40-400a-ae90-4738dee7e95f&qrSize=3",
"2":"https://spo.order.airregi.jp/auth/seat?t=fa86f12b-3295-46aa-b35e-8ed5fe036d1a&qrSize=3",
"3":"https://spo.order.airregi.jp/auth/seat?t=a44bbacc-d0fa-48ec-b15b-39674dcc5623&qrSize=3",
"4":"https://spo.order.airregi.jp/auth/seat?t=8fb9556b-04a4-4a8e-bf0a-be712764854e&qrSize=3",
"5":"https://spo.order.airregi.jp/auth/seat?t=2bfd7391-9e21-44f7-939c-dcd19fbdca02&qrSize=3"
};

document.getElementById("orderBtn").onclick = () => {
if(urls[table]){
window.location.href = urls[table];
}
};
</script>

</body>
</html>
