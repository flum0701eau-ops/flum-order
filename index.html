<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FLÜM ORDER</title>

<style>

body{
margin:0;
background:#000;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

/* コンテナ */
.wrap{
position:relative;
width:100%;
max-width:420px;
font-size:0;
}

/* 画像 */
.bg{
width:100%;
display:block;
}

/* クリック共通 */
.area{
position:absolute;
}

/* =========================
   ORDER（中央ボタン部分）
========================= */
.order{
left:50%;
transform:translateX(-50%);
top:36%;
width:80%;
height:20%;
}

/* =========================
   INSTAGRAM（左下）
========================= */
.ig{
left:8%;
top:62%;
width:38%;
height:18%;
}

/* =========================
   REVIEWS（右下）
========================= */
.rev{
right:8%;
top:62%;
width:38%;
height:18%;
}

/* 押した時 */
.area:active{
opacity:0.6;
}

</style>
</head>

<body>

<div class="wrap">

  <!-- 画像 -->
  <img class="bg" src="flum.jpg" />

  <!-- 透明クリックエリア -->
  <a class="area order" id="orderBtn"></a>
  <a class="area ig" href="https://www.instagram.com/flum0701"></a>
  <a class="area rev" href="https://search.google.com/local/writereview?placeid=ChIJMYIVIGnnAGARTbq80Jket98"></a>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const table = params.get("t");

const urls = {
"1":"https://spo.order.airregi.jp/auth/seat?t=17d80d46-9a40-400a-ae90-4738dee7e95f&qrSize=3",
"2":"https://spo.order.airregi.jp/auth/seat?t=fa86f12b-3295-46aa-b35e-8ed5fe036d1a&qrSize=3",
"3":"https://spo.order.airregi.jp/auth/seat?t=a44bbacc-d0fa-48ec-b15b-39674dcc5623&qrSize=3",
"4":"https://spo.order.airregi.jp/auth/seat?t=8fb9556b-04a4-4a8e-bf0a-be712764854e&qrSize=3",
"5":"https://spo.order.airregi.jp/auth/seat?t=2bfd7391-9e21-44f7-939c-dcd19fbdca02&qrSize=3"
};

document.getElementById("orderBtn").onclick = (e) => {
  e.preventDefault();
  if(urls[table]){
    window.location.href = urls[table];
  } else {
    alert("テーブルなし");
  }
};

</script>

</body>
</html>
