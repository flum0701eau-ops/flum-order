<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FLÜM ORDER</title>

<style>

body{
margin:0;
background:#000;
display:flex;
justify-content:center;
font-family:sans-serif;
}

/* コンテナ */
.wrap{
position:relative;
width:100%;
max-width:420px;
}

/* 背景画像 */
.bg{
width:100%;
display:block;
}

/* UI全体 */
.ui{
position:absolute;
top:38%;
left:50%;
transform:translateX(-50%);
width:85%;
text-align:center;
}

/* 小テキスト */
.sub{
font-size:12px;
color:#444;
margin-bottom:12px;
}

/* ===== ORDER（主役ガラス） ===== */
.order{
display:block;
width:100%;
padding:18px 0;
border-radius:18px;

background:rgba(255,255,255,0.10);
backdrop-filter: blur(14px);
-webkit-backdrop-filter: blur(14px);

border:1px solid rgba(255,255,255,0.25);

box-shadow:
0 20px 40px rgba(0,0,0,0.35),
inset 0 1px 0 rgba(255,255,255,0.15);

color:#fff;
text-decoration:none;
letter-spacing:3px;
font-size:14px;

margin-bottom:34px;

transition:0.2s;
}

.order:active{
transform:scale(0.97);
opacity:0.85;
}

/* 下ボタン */
.bottom{
display:flex;
gap:12px;
}

.btn{
flex:1;
padding:14px 0;
border-radius:14px;

background:rgba(255,255,255,0.08);
backdrop-filter: blur(10px);
-webkit-backdrop-filter: blur(10px);

border:1px solid rgba(255,255,255,0.18);

color:#ddd;
text-decoration:none;
font-size:12px;
}

.btn:active{
transform:scale(0.97);
opacity:0.8;
}

/* 余白 */
.thanks{
margin-top:40px;
font-size:11px;
color:#666;
}

</style>
</head>

<body>

<div class="wrap">

  <!-- 背景 -->
  <img class="bg" src="flum.jpg">

  <!-- UI -->
  <div class="ui">

    <div class="sub">ご注文はこちらから</div>

    <a class="order" href="https://spo.order.airregi.jp/auth/seat?t=XXXX">
      ORDER
    </a>

    <div class="bottom">
      <a class="btn" href="https://www.instagram.com/flum0701">INSTAGRAM</a>
      <a class="btn" href="https://search.google.com/local/writereview?placeid=XXXX">REVIEWS</a>
    </div>

    <div class="thanks">
      THANK YOU<br>
      ご利用ありがとうございます
    </div>

  </div>

</div>

</body>
</html>
