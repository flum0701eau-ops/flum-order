<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLÜM ORDER</title>

<style>
body{
margin:0;
background:#000;
font-family:sans-serif;
color:#fff;
text-align:center;
padding:40px 20px;
}

.btn{
display:block;
width:100%;
padding:16px;
margin:12px 0;
border-radius:12px;
text-decoration:none;
font-weight:600;
}

.order{
background:#111;
color:#C8A96A;
border:1px solid #C8A96A;
}

.sub{
color:#aaa;
font-size:13px;
margin-bottom:20px;
}

.hidden{display:none;}
</style>
</head>

<body>

<div class="sub">FLÜM ORDER SYSTEM</div>

<!-- 状態表示（必要なら） -->
<div id="status">読み込み中...</div>

<a class="btn order hidden" id="orderBtn">ORDER</a>

<!-- LINE SDK -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script>

const liffId = "2007912475-TlwIvzlF";

/* =========================
   ① 席保存（QR）
========================= */
const params = new URLSearchParams(location.search);
const table = params.get("t");

if (table) {
  sessionStorage.setItem("table", table);
}

/* =========================
   ② LIFF初期化
========================= */
liff.init({ liffId }).then(() => {

  document.getElementById("status").innerText = "準備OK";

  // UI表示（リッチメニューから来た人用）
  document.getElementById("orderBtn").classList.remove("hidden");

});

/* =========================
   ③ Airレジ分岐
========================= */
const urls = {
  "1": "https://spo.order.airregi.jp/auth/seat?t=17d80d46-9a40-400a-ae90-4738dee7e95f&qrSize=3",
  "2": "https://spo.order.airregi.jp/auth/seat?t=fa86f12b-3295-46aa-b35e-8ed5fe036d1a&qrSize=3",
  "3": "https://spo.order.airregi.jp/auth/seat?t=a44bbacc-d0fa-48ec-b15b-39674dcc5623&qrSize=3",
  "4": "https://spo.order.airregi.jp/auth/seat?t=8fb9556b-04a4-4a8e-bf0a-be712764854e&qrSize=3",
  "5": "https://spo.order.airregi.jp/auth/seat?t=2bfd7391-9e21-44f7-939c-dcd19fbdca02&qrSize=3"
};

/* =========================
   ④ ORDERボタン
========================= */
document.getElementById("orderBtn").addEventListener("click", () => {

  const table = sessionStorage.getItem("table");

  if (urls[table]) {
    window.location.href = urls[table];
  } else {
    alert("テーブル情報がありません（QRから入ってください）");
  }

});

</script>

</body>
</html>
